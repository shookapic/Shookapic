<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Cédric Roulof — shookapic</title>
  <desc id="desc">Software development, cybersecurity, and systems. A navy header with mint accents and a terminal illustration.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c30"/>
